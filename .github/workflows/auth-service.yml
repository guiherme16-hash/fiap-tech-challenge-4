name: auth-service

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "auth-service/**"
      - ".github/workflows/auth-service.yml"
      - ".github/workflows/_reusable-go.yml"
      - ".github/ci-trigger"
  pull_request:
    paths:
      - "auth-service/**"
      - ".github/workflows/auth-service.yml"
      - ".github/workflows/_reusable-go.yml"
      - ".github/ci-trigger"

permissions:
  contents: write
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/_reusable-go.yml
    with:
      service_name: auth-service
      service_path: auth-service
      ecr_repository: auth-service
