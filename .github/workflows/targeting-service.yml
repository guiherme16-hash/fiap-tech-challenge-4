name: targeting-service

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "targeting-service/**"
      - ".github/workflows/targeting-service.yml"
      - ".github/workflows/_reusable-python.yml"
      - ".github/ci-trigger"
  pull_request:
    paths:
      - "targeting-service/**"
      - ".github/workflows/targeting-service.yml"
      - ".github/workflows/_reusable-python.yml"
      - ".github/ci-trigger"

permissions:
  contents: write
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/_reusable-python.yml
    with:
      service_name: targeting-service
      service_path: targeting-service
      ecr_repository: targeting-service
