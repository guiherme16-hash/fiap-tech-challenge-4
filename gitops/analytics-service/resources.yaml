apiVersion: v1
kind: ServiceAccount
metadata:
  name: tc2-analytics-sa
  namespace: tc2-analytics
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::521590706153:role/togglemaster-prod-analytics-irsa
---
apiVersion: v1
kind: Service
metadata:
  name: tc2-analytics-service
  namespace: tc2-analytics
spec:
  type: ClusterIP
  selector:
    app: tc2-analytics
  ports:
    - protocol: TCP
      port: 8005
      targetPort: 8005
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tc2-analytics-config
  namespace: tc2-analytics
data:
  PORT: "8005"
  AWS_REGION: "us-east-1"
  AWS_DYNAMODB_TABLE: "ToggleMasterAnalytics"
  AWS_SQS_URL: "https://sqs.us-east-1.amazonaws.com/521590706153/analytics-service-sqs"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tc2-analytics-hpa
  namespace: tc2-analytics
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tc2-analytics
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
