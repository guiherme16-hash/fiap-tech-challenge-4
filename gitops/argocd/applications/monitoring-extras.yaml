# Manifests "cola" do monitoramento (ServiceMonitors, etc.) aplicados direto.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-extras
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # TODO(repo-sweep): trocar para a URL final do repo da Fase 4
    repoURL: https://github.com/guiherme16-hash/fiap-tech-challenge-4.git
    targetRevision: main
    path: gitops/monitoring/extras
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
