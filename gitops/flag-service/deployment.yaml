apiVersion: apps/v1
kind: Deployment
metadata:
  name: tc2-flags
  namespace: tc2-flags
  labels:
    app: tc2-flags
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tc2-flags
  template:
    metadata:
      labels:
        app: tc2-flags
    spec:
      containers:
        - name: flag-service
          # A tag é atualizada automaticamente pelo pipeline de CI (bump do GitOps).
          image: 521590706153.dkr.ecr.us-east-1.amazonaws.com/flag-service:f8fe208
          ports:
            - containerPort: 8002
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: tc2-flags-config
                  key: PORT
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: tc2-flags-config
                  key: AUTH_SERVICE_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tc2-flags-secret
                  key: DATABASE_URL
