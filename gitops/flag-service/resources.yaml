apiVersion: v1
kind: Service
metadata:
  name: tc2-flags-service
  namespace: tc2-flags
spec:
  type: ClusterIP
  selector:
    app: tc2-flags
  ports:
    - protocol: TCP
      port: 8002
      targetPort: 8002
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tc2-flags-config
  namespace: tc2-flags
data:
  PORT: "8002"
  AUTH_SERVICE_URL: "http://tc2-auth-service.tc2-auth.svc.cluster.local:8001"
