# Requer um Ingress Controller NGINX instalado no cluster.
# Os "route-services" são ExternalName que apontam para os Services em cada namespace.
apiVersion: v1
kind: Service
metadata:
  name: tc2-auth-route-service
  namespace: tc2-ingress
spec:
  type: ExternalName
  externalName: tc2-auth-service.tc2-auth.svc.cluster.local
  ports:
    - port: 8001
      targetPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: tc2-flags-route-service
  namespace: tc2-ingress
spec:
  type: ExternalName
  externalName: tc2-flags-service.tc2-flags.svc.cluster.local
  ports:
    - port: 8002
      targetPort: 8002
---
apiVersion: v1
kind: Service
metadata:
  name: tc2-targeting-route-service
  namespace: tc2-ingress
spec:
  type: ExternalName
  externalName: tc2-targeting-service.tc2-targeting.svc.cluster.local
  ports:
    - port: 8003
      targetPort: 8003
---
apiVersion: v1
kind: Service
metadata:
  name: tc2-evaluation-route-service
  namespace: tc2-ingress
spec:
  type: ExternalName
  externalName: tc2-evaluation-service.tc2-evaluation.svc.cluster.local
  ports:
    - port: 8004
      targetPort: 8004
---
apiVersion: v1
kind: Service
metadata:
  name: tc2-analytics-route-service
  namespace: tc2-ingress
spec:
  type: ExternalName
  externalName: tc2-analytics-service.tc2-analytics.svc.cluster.local
  ports:
    - port: 8005
      targetPort: 8005
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tc2-ingress
  namespace: tc2-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /auth(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: tc2-auth-route-service
                port:
                  number: 8001
          - path: /flags(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: tc2-flags-route-service
                port:
                  number: 8002
          - path: /target(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: tc2-targeting-route-service
                port:
                  number: 8003
          - path: /evaluation(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: tc2-evaluation-route-service
                port:
                  number: 8004
          - path: /analytics(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: tc2-analytics-route-service
                port:
                  number: 8005
