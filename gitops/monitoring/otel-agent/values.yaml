# =====================================================================
# OTel Collector - AGENT (mode: daemonset). Roda em cada node e coleta
# TODOS os logs dos conteineres (/var/log/pods), enriquece com metadados
# do Kubernetes e encaminha para o gateway via OTLP.
# Chart: open-telemetry/opentelemetry-collector 0.178.3
# ns: monitoring | release: otel-agent
# =====================================================================

mode: daemonset

image:
  repository: otel/opentelemetry-collector-contrib
command:
  name: otelcol-contrib

presets:
  # Cria o receiver filelog + pipeline de logs lendo /var/log/pods/*
  logsCollection:
    enabled: true
    includeCollectorLogs: false
  # Adiciona o processor k8sattributes (namespace, pod, container...) + RBAC
  kubernetesAttributes:
    enabled: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

config:
  exporters:
    otlp/gateway:
      endpoint: otel-gateway-opentelemetry-collector.monitoring.svc.cluster.local:4317
      tls:
        insecure: true
  service:
    pipelines:
      # mantem receivers/processors dos presets; so troca o destino para o gateway
      logs:
        exporters: [otlp/gateway]
