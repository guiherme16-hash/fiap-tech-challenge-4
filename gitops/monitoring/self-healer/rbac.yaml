# Permissao minima: o self-healer so pode LER e PATCHEAR deployments.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: self-healer
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: self-healer
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: self-healer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: self-healer
subjects:
  - kind: ServiceAccount
    name: self-healer
    namespace: monitoring
