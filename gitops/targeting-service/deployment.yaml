apiVersion: apps/v1
kind: Deployment
metadata:
  name: tc2-targeting
  namespace: tc2-targeting
  labels:
    app: tc2-targeting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tc2-targeting
  template:
    metadata:
      labels:
        app: tc2-targeting
    spec:
      containers:
        - name: targeting-service
          # A tag é atualizada automaticamente pelo pipeline de CI (bump do GitOps).
          image: 521590706153.dkr.ecr.us-east-1.amazonaws.com/targeting-service:958801c
          ports:
            - containerPort: 8003
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: tc2-targeting-config
                  key: PORT
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: tc2-targeting-config
                  key: AUTH_SERVICE_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tc2-targeting-secret
                  key: DATABASE_URL
