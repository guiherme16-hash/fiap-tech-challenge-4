apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tc2-evaluation-hpa
  namespace: tc2-evaluation
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tc2-evaluation

  minReplicas: 1
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

          